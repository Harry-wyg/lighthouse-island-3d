<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141a33">
<title>灯塔岛 · 七日漂流</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#2b2a33;--muted:#8a8597;--paper:#fffaf0;--line:#eadfca;--accent:#ff8a5b;--accent2:#ffb36b;
  --NT:#8b7bff;--NF:#3ecf8e;--SJ:#4a90ff;--SP:#f5a623;
}
html,body{margin:0;height:100%}
body{
  background:#141a33;
  background-image:radial-gradient(1200px 600px at 20% 10%,#26305e 0,transparent 60%),radial-gradient(900px 500px at 90% 90%,#3a2a55 0,transparent 60%);
  display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:var(--ink);overflow:hidden;
}
#desk{display:none;position:fixed;left:6vw;top:50%;transform:translateY(-50%);color:#dfe4ff;max-width:300px}
#desk h1{font-size:34px;margin:0 0 12px;letter-spacing:2px}
#desk p{opacity:.7;line-height:1.8;font-size:15px}
@media (min-width:1000px){#desk{display:block}}
#app{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none}
@media (min-width:560px){#app{width:420px;height:min(880px,94vh);border-radius:34px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 9px #0c1026,0 0 0 10px #2a3160}}

/* ---------- 背景 ---------- */
#bg{position:absolute;inset:0;--sky1:#7ec8ef;--sky2:#e9f7ff;--sea1:#3fb0c9;--sea2:#1f6f95;--sand:#f4dca6;--sun:#fff4b8;--suny:12%}
#bg.dawn{--sky1:#f39d8b;--sky2:#ffe4c4;--sea1:#73b5c4;--sea2:#2d6f8f;--sand:#efcf99;--sun:#ffd28a;--suny:42%}
#bg.dusk{--sky1:#56468a;--sky2:#ff9e7a;--sea1:#5d6fa3;--sea2:#2a3466;--sand:#d8b483;--sun:#ffb27a;--suny:46%}
#bg.night{--sky1:#0b1130;--sky2:#2b3a6b;--sea1:#1f2d5a;--sea2:#0a1230;--sand:#7d705f;--sun:#f4f1d0;--suny:9%}
#bg.storm{--sky1:#262e3c;--sky2:#5b6577;--sea1:#3b4c5e;--sea2:#141c26;--sand:#7c7466;--sun:transparent}
#bg.forest{--sky1:#3f7a4c;--sky2:#b6dca8;--sea1:#3d6e47;--sea2:#1f3d27;--sand:#5f8546;--sun:#f6ffd0;--suny:8%}
#sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky1),var(--sky2) 62%)}
#sun{position:absolute;width:64px;height:64px;border-radius:50%;background:var(--sun);top:var(--suny);left:16%;box-shadow:0 0 70px 10px var(--sun);transition:top 1.4s ease,background 1s}
#bg.night #sun{width:40px;height:40px;box-shadow:0 0 40px 4px rgba(244,241,208,.5)}
.stars{position:absolute;inset:0 0 40% 0;opacity:0;transition:opacity 1.2s;
  background-image:radial-gradient(1.6px 1.6px at 12% 22%,#fff,transparent),radial-gradient(1.2px 1.2px at 30% 8%,#fff,transparent),radial-gradient(2px 2px at 48% 30%,#fff,transparent),radial-gradient(1.2px 1.2px at 64% 14%,#fff,transparent),radial-gradient(1.6px 1.6px at 82% 26%,#fff,transparent),radial-gradient(1.2px 1.2px at 90% 6%,#fff,transparent),radial-gradient(1.4px 1.4px at 22% 40%,#fff,transparent),radial-gradient(1.2px 1.2px at 74% 44%,#fff,transparent);
  animation:twinkle 3s ease-in-out infinite alternate}
#bg.night .stars{opacity:1}
@keyframes twinkle{to{filter:brightness(.6)}}
#sea{position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(var(--sea1),var(--sea2))}
#sea::before{content:"";position:absolute;left:0;width:200%;top:-7px;height:14px;
  background:radial-gradient(circle at 12px 14px,var(--sea1) 11px,transparent 12px) repeat-x;background-size:24px 14px;animation:wave 7s linear infinite}
#sea::after{content:"";position:absolute;inset:18% 0 30% 0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.12) 0 2px,transparent 2px 26px);animation:glint 5s ease-in-out infinite alternate}
@keyframes wave{to{transform:translateX(-50%)}}
@keyframes glint{to{transform:translateX(20px);opacity:.5}}
#sand{position:absolute;left:-10%;right:-10%;bottom:-7%;height:21%;background:var(--sand);border-radius:50% 50% 0 0/38% 38% 0 0;transition:background 1s}
.rain{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 1s;
  background-image:repeating-linear-gradient(105deg,rgba(255,255,255,.28) 0 1px,transparent 1px 13px);background-size:300px 300px;animation:rain .45s linear infinite}
#bg.storm .rain{opacity:1}
#bg.storm #sky{animation:flash 7s infinite}
@keyframes rain{to{background-position:-60px 300px}}
@keyframes flash{0%,92%,96%,100%{filter:none}93%,95%{filter:brightness(2.2)}}
#lh{position:absolute;right:8%;bottom:37%;width:54px;transition:opacity .6s}
#lh svg{overflow:visible;display:block;width:100%}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 14px 8px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35);z-index:5;opacity:0;transition:opacity .5s}
#hud.show{opacity:1}
#hud .day{font-weight:800;font-size:14px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
#hud .parts{display:flex;gap:2px;font-size:13px;flex:none}
#hud .parts span{filter:grayscale(1) brightness(1.6);opacity:.45;transition:all .5s}
#hud .parts span.got{filter:none;opacity:1;transform:scale(1.1)}
#hud button{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:99px;padding:5px 10px;font-size:12px;white-space:nowrap;flex:none;cursor:pointer;backdrop-filter:blur(6px)}

/* ---------- 舞台 ---------- */
#stage{position:absolute;top:calc(56px + env(safe-area-inset-top));left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;padding:0 16px 16px;z-index:2}
.vig{margin-top:7vh;text-align:center}
.vig .big{font-size:86px;line-height:1.1;filter:drop-shadow(0 8px 14px rgba(0,0,0,.25));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.vig .cap{color:#fff;font-weight:700;margin:8px 0;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.cast{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.9);border-radius:99px;padding:4px 10px 4px 4px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.chip i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:12px}
.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}

.panel{background:var(--paper);border-radius:22px;padding:18px 16px;width:100%;max-height:100%;overflow:auto;box-shadow:0 14px 40px rgba(0,0,0,.25);margin-top:auto;margin-bottom:auto}
.ptitle{font-size:18px;font-weight:800;margin-bottom:4px}
.phint{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));cursor:pointer;margin-top:10px;font-family:inherit;box-shadow:0 6px 16px rgba(255,138,91,.35);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;box-shadow:none;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.row{display:flex;gap:8px}.row .btn{flex:1}

/* ---------- 对话 & 选择 ---------- */
#dialog,#choice{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:8;background:rgba(255,250,240,.97);border-radius:20px;padding:20px 18px 20px;box-shadow:0 12px 34px rgba(0,0,0,.28);transform:translateY(130%);opacity:0;transition:transform .35s cubic-bezier(.2,.9,.3,1),opacity .3s}
#dialog.show,#choice.show{transform:none;opacity:1}
#dialog{min-height:108px;cursor:pointer}
#dialog .who{position:absolute;top:-13px;left:16px;background:var(--c);color:#fff;font-weight:800;font-size:13px;padding:4px 12px;border-radius:99px;box-shadow:0 3px 8px rgba(0,0,0,.2)}
#dialog .txt{font-size:16px;line-height:1.75;min-height:56px;white-space:pre-wrap}
#dialog .next{position:absolute;right:16px;bottom:8px;color:var(--accent);font-size:12px;opacity:0;animation:blink 1s infinite}
#dialog.done .next{opacity:1}
@keyframes blink{50%{transform:translateY(3px)}}
#choice .q{font-weight:800;font-size:16px;line-height:1.6;margin-bottom:10px}
#choice .opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-size:15px;line-height:1.55;margin-top:9px;cursor:pointer;color:var(--ink);font-family:inherit;transition:all .2s}
#choice .opt:hover{border-color:var(--accent)}
#choice .opt.picked{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.02)}
#choice .opt:disabled:not(.picked){opacity:.35}
.timer{height:6px;background:#f0e6d6;border-radius:9px;overflow:hidden;margin:-2px 0 6px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#ff5b5b,#ffb36b);animation:shrink linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}

/* ---------- 遮罩层 ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.daycard{background:rgba(10,14,34,.92);color:#fff;text-align:center;opacity:0;transition:opacity .6s;pointer-events:none}
.daycard.in{opacity:1}
.daycard .dn{font-size:14px;letter-spacing:6px;opacity:.7}
.daycard .dt{font-size:30px;font-weight:800;margin:10px 0;letter-spacing:3px}
.daycard .ds{font-size:14px;opacity:.65}
.daycard .line{width:40px;height:2px;background:var(--accent);margin:14px auto}

#title{color:#fff;text-align:center;background:linear-gradient(180deg,rgba(11,17,48,.1),rgba(11,17,48,.55))}
#title h1{font-size:40px;margin:0;letter-spacing:6px;text-shadow:0 4px 18px rgba(0,0,0,.4)}
#title .sub{opacity:.9;margin:10px 0 4px;letter-spacing:2px}
#title .meta{opacity:.7;font-size:13px;margin-bottom:30px}
#title .btn{max-width:260px;font-size:17px;padding:15px}
#title .big-lh{width:110px;margin-bottom:18px}
#title .big-lh svg{width:100%;overflow:visible}

.modal{background:rgba(10,14,34,.55);backdrop-filter:blur(3px)}
.modal .panel{max-width:400px;margin:0}

/* ---------- 小游戏 ---------- */
.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;background:#fff;outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{resize:none;height:84px;line-height:1.6}
.colors{display:flex;gap:10px;justify-content:center;margin:14px 0 4px}
.colors b{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 2px transparent;transition:box-shadow .2s}
.colors b.on{box-shadow:0 0 0 2px var(--ink)}

.fire{position:relative;width:280px;height:280px;margin:2vh auto 0}
.fire .flame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:64px;animation:flick .6s infinite alternate}
@keyframes flick{to{transform:translate(-50%,-52%) scale(1.06)}}
.fire .glow{position:absolute;inset:60px;border-radius:50%;background:radial-gradient(rgba(255,170,80,.55),transparent 70%)}
.seat{position:absolute;width:132px;background:rgba(255,250,240,.95);border:0;border-radius:16px;padding:10px;font-size:12.5px;line-height:1.5;text-align:left;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3);font-family:inherit;color:var(--ink);transition:transform .2s}
.seat:hover{transform:scale(1.04)}
.seat b{display:block;font-size:14px;margin-bottom:2px}

.battery{width:150px;height:62px;border:4px solid #fff;border-radius:12px;padding:5px;position:relative;margin:4vh auto 8px}
.battery::after{content:"";position:absolute;right:-12px;top:17px;width:7px;height:20px;background:#fff;border-radius:0 4px 4px 0}
.battery .bf{height:100%;border-radius:5px;background:#5fe08a;transition:width .1s,background .5s}
.blabel{color:#fff;text-align:center;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.4)}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.item{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 2px;text-align:center;cursor:pointer;transition:all .2s;font-family:inherit;color:var(--ink)}
.item .e{font-size:28px}.item .l{font-size:11px;color:var(--muted);margin-top:2px}
.item.seen{background:#fff3e6;border-color:var(--accent2)}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.item.gone{opacity:.15;pointer-events:none}
.detail{min-height:64px;background:#fff;border-radius:12px;padding:12px;margin-top:12px;font-size:14px;line-height:1.7;color:#4a4656;border:1px dashed var(--line)}

.cloudbox{background:linear-gradient(#8fcff3,#dff3ff);border-radius:16px;height:170px;display:grid;place-items:center;margin-bottom:6px}

.prow{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;margin-top:8px}
.prow .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.prow .nm{font-weight:700;font-size:14px}
.prow .inf{font-size:12px;color:var(--muted);line-height:1.5}
.prow .inf div{display:none}.prow .inf div.on{display:block}
.stp{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.stp button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:18px;cursor:pointer;line-height:1;color:var(--ink)}
.stp b{min-width:34px;text-align:center;font-size:14px}
.pool{text-align:center;font-weight:800;font-size:15px;margin:4px 0}
.tabs{display:flex;gap:8px;margin-bottom:4px}
.tabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 4px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.tabs button.on{background:#fff3e6;border-color:var(--accent2)}

.task{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-top:8px;cursor:pointer;font-size:15px;position:relative;overflow:hidden}
.task .no{width:24px;height:24px;border-radius:50%;border:1.5px dashed #cfc3ad;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.task.on .no{background:var(--accent);border:0;color:#fff}
.task .pg{position:absolute;left:0;bottom:0;height:3px;background:#5fe08a;width:0}
.task.doing .pg{transition:width .7s linear;width:100%}
.task.done{opacity:.45;text-decoration:line-through;pointer-events:none}
.task.done .no{background:#5fe08a;border:0;color:#fff}

.bag{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.comp{border:2px dashed #cfc3ad;border-radius:14px;padding:8px;min-height:72px;cursor:pointer;background:#fff;transition:all .2s}
.comp.ready{border-color:var(--accent);background:#fff3e6}
.comp .ct{font-size:13px;font-weight:800}
.comp .cc{font-size:20px;margin-top:4px;min-height:26px;word-break:break-all}

.big-lh-wrap{margin:auto;text-align:center;color:#fff}
.big-lh-wrap svg{width:170px;overflow:visible}
.beam{transform-origin:60px 52px;animation:sweep 3.2s ease-in-out infinite;opacity:0;transition:opacity 1s}
.lit .beam{opacity:1}
@keyframes sweep{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.lamp{transition:fill 1.2s,filter 1.2s}
.lit .lamp{filter:drop-shadow(0 0 10px var(--lamp))}

/* ---------- 结果 ---------- */
#result{position:absolute;inset:0;z-index:30;overflow-y:auto;background:#f6f1e7;-webkit-overflow-scrolling:touch}
.rhead{padding:calc(40px + env(safe-area-inset-top)) 20px 64px;color:#fff;text-align:center;background:linear-gradient(160deg,var(--tc),#1b2148);position:relative}
.rhead .tag{display:inline-block;font-size:12px;letter-spacing:3px;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:99px}
.rhead .emo{font-size:84px;margin:14px 0 4px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.3))}
.rhead .type{font-size:52px;font-weight:900;letter-spacing:6px;line-height:1.1}
.rhead .role{font-size:22px;font-weight:800;margin-top:6px}
.rhead .tl{opacity:.85;margin-top:10px;font-size:14px;line-height:1.6}
.rbody{padding:0 14px 40px;margin-top:-40px;position:relative}
.card{background:#fff;border-radius:20px;padding:18px 16px;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.card h3{margin:0 0 12px;font-size:16px}
.card p{margin:0;line-height:1.8;font-size:14.5px;color:#4a4656}
.bar{margin:14px 0}
.bar .lb{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
.bar .lb span.dim{opacity:.4}
.bar .tr{height:10px;background:#eee8dc;border-radius:9px;overflow:hidden;position:relative}
.bar .tr i{display:block;height:100%;background:var(--tc);border-radius:9px;width:0;transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
.bar .bal{font-size:11px;color:var(--tc);text-align:center;margin-top:4px;font-weight:700}
.mom{list-style:none;padding:0;margin:0}
.mom li{padding:10px 0;border-bottom:1px dashed #eee3d0;font-size:14px;line-height:1.7;display:flex;gap:10px;align-items:flex-start}
.mom li:last-child{border:0}
.mom .d{flex:none;font-size:11px;font-weight:800;background:#fff3e6;color:var(--accent);padding:2px 7px;border-radius:7px;margin-top:3px}
.mom .k{flex:none;margin-left:auto;font-weight:900;color:var(--tc)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills span{background:#f4efe5;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.mates{display:flex;gap:10px}
.mate{flex:1;border-radius:16px;background:#f8f4ec;padding:12px;text-align:center}
.mate .e{font-size:34px}.mate .t{font-weight:900;margin-top:4px}.mate .n{font-size:12px;color:var(--muted)}.mate .h{font-size:11px;margin-top:6px;font-weight:700;color:var(--tc)}
.quote{font-size:15px;line-height:1.8;color:#4a4656;border-left:3px solid var(--tc);padding-left:12px;font-style:italic}
.disc{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.7;margin-top:16px}
#posterBox img{width:100%;border-radius:14px;display:block}
</style>
</head>
<body>
<div id="desk">
  <h1>灯塔岛 · 七日漂流</h1>
  <p>一场荒岛冒险，不做一道选择题。<br>你在岛上的每一次行动，都会悄悄写下你的人格密码。<br>七天后，灯塔会用它的颜色告诉你：你是谁。</p>
</div>

<div id="app">
  <div id="bg" class="dawn">
    <div id="sky"></div><div class="stars"></div><div id="sun"></div>
    <div id="lh"></div>
    <div id="sea"></div><div id="sand"></div><div class="rain"></div>
  </div>
  <div id="hud">
    <div class="day" id="hudDay">序章</div>
    <div class="parts" id="hudParts"></div>
    <button id="journalBtn">📔 日志</button>
  </div>
  <div id="stage"></div>
  <div id="dialog"></div>
  <div id="choice"></div>
</div>

<script>
/* ================== 工具函数 ================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const app = $('#app');

/* ================== 游戏状态 & 计分 ================== */
// 每个维度：正值 = 第一个字母（E / S / T / J），负值 = 第二个字母（I / N / F / P）
const DIMS = { EI: ['E', 'I'], SN: ['S', 'N'], TF: ['T', 'F'], JP: ['J', 'P'] };
const LETTER_NAME = { E: '外向', I: '内向', S: '实感', N: '直觉', T: '思考', F: '情感', J: '计划', P: '随性' };
const G = {
  name: '旅人', color: '#ff8a5b', day: 0, note: '', journal: 0, parts: [],
  sig: { EI: [], SN: [], TF: [], JP: [] },     // 全部信号
  calm: { EI: [], SN: [], TF: [], JP: [] },    // 平常状态下的信号
  stress: { EI: [], SN: [], TF: [], JP: [] },  // 压力状态下的信号
  moments: [],
};
function add(dim, v, w = 1, moment, stress = false) {
  if (!w) return;
  const s = { v: clamp(v, -1, 1), w };
  G.sig[dim].push(s);
  (stress ? G.stress : G.calm)[dim].push(s);
  if (moment) G.moments.push({ dim, v, w, text: moment, day: G.day });
}
function dimScore(dim, src = G.sig) {
  let a = 0, b = 0;
  for (const s of src[dim]) { a += s.v * s.w; b += s.w; }
  return b ? a / b : 0;
}
const pct = dim => Math.round(50 + dimScore(dim) * 50); // 第一个字母的百分比

/* ================== 对话 ================== */
const fmt = t => t.replace(/\{name\}/g, G.name);
function say(text, who) {
  return new Promise(res => {
    const d = $('#dialog');
    const n = who ? NPC[who] : null;
    d.innerHTML = (n ? `<div class="who" style="--c:${n.c}">${who === 'me' ? G.name : n.n}</div>` : '') + `<div class="txt"></div><div class="next">点击继续 ▼</div>`;
    d.classList.remove('done'); d.classList.add('show');
    const t = d.querySelector('.txt'), full = fmt(text);
    let i = 0, done = false;
    const iv = setInterval(() => { i++; t.textContent = full.slice(0, i); if (i >= full.length) finish(); }, 26);
    function finish() { clearInterval(iv); t.textContent = full; done = true; d.classList.add('done'); }
    d.onclick = () => { if (!done) return finish(); d.onclick = null; res(); };
  });
}
async function talk(lines) {
  for (const l of lines) Array.isArray(l) ? await say(l[1], l[0]) : await say(l);
  $('#dialog').classList.remove('show');
  await wait(200);
}
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && $('#dialog').classList.contains('show') && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#dialog').click(); }
});

/* ================== 选择 ================== */
// O(选项文字, 维度, 方向, 权重, 关键时刻文字或函数(rt) )
const O = (t, dim, v, w = 1, m) => ({ t, dim, v, w, m });
function choose(prompt, opts, { timer = 0 } = {}) {
  return new Promise(res => {
    const c = $('#choice'); c.innerHTML = '';
    c.append(el('div', 'q', fmt(prompt)));
    let tm;
    if (timer) {
      const bar = el('div', 'timer', '<i></i>'); bar.firstChild.style.animationDuration = timer + 's'; c.append(bar);
      tm = setTimeout(() => finish(null), timer * 1000);
    }
    for (const o of shuffle(opts)) { const b = el('button', 'opt', fmt(o.t)); b.onclick = () => finish(o, b); c.append(b); }
    requestAnimationFrame(() => c.classList.add('show'));
    const t0 = performance.now();
    let over = false;
    function finish(o, b) {
      if (over) return; over = true; clearTimeout(tm);
      $$('button', c).forEach(x => x.disabled = true);
      if (b) b.classList.add('picked');
      const rt = (performance.now() - t0) / 1000;
      if (o) add(o.dim, o.v, o.w, typeof o.m === 'function' ? o.m(rt) : o.m, timer > 0);
      setTimeout(() => { c.classList.remove('show'); setTimeout(() => res({ o, rt }), 250); }, 420);
    }
  });
}

function cloudSVG(seed) {
  let r = seed * 9301 + 49297; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  let c = '';
  for (let i = 0; i < 9; i++) c += `<circle cx="${60 + rnd() * 140}" cy="${55 + rnd() * 50}" r="${18 + rnd() * 26}" fill="#fff"/>`;
  return `<svg viewBox="0 0 260 160" width="240" style="filter:drop-shadow(0 6px 10px rgba(0,60,120,.15))">${c}</svg>`;
}

function waterGame() {
  return new Promise(res => {
    const ppl = [
      { k: 'me', c: '今天：捡了一下午的柴火', m: '状态：有点累，但还好' },
      { k: 'chen', c: '今天：搬了一整天石头 ⭐⭐⭐⭐⭐', m: '状态：很累，嘴上说没事' },
      { k: 'mu', c: '今天：发烧，几乎没干活 ⭐', m: '状态：嘴唇干裂，一直在说「对不起」' },
      { k: 'lu', c: '今天：做了三顿饭 ⭐⭐⭐', m: '状态：刚被老陈说了几句，有点委屈' },
    ];
    const cnt = { me: 0, chen: 0, mu: 0, lu: 0 }, TOTAL = 10;
    let firstInfo = null;
    const p = panel(`<div class="ptitle">💧 分配淡水</div><div class="phint">只剩 10 瓶水，要撑到明天。由你来分。</div>
      <div class="tabs"><button data-t="c">📊 查看今日贡献</button><button data-t="m">💭 查看身体和心情</button></div>
      <div class="rows"></div><div class="pool">剩余：<span>10</span> 瓶</div><button class="btn" disabled>就这么分</button>`);
    const rows = $('.rows', p);
    ppl.forEach(x => {
      const n = NPC[x.k];
      const r = el('div', 'prow', `<div class="av" style="background:${n.c}">${x.k === 'me' ? '我' : n.n.slice(-1)}</div><div><div class="nm">${x.k === 'me' ? G.name + '（你）' : n.n}</div><div class="inf"><div class="c">${x.c}</div><div class="m">${x.m}</div></div></div><div class="stp"><button>−</button><b>0 瓶</b><button>＋</button></div>`);
      const [minus, plus] = $$('.stp button', r), b = $('.stp b', r);
      const upd = () => {
        b.textContent = cnt[x.k] + ' 瓶';
        const left = TOTAL - Object.values(cnt).reduce((a, c) => a + c, 0);
        $('.pool span', p).textContent = left; $('.btn', p).disabled = left !== 0;
      };
      minus.onclick = () => { if (cnt[x.k] > 0) { cnt[x.k]--; upd(); } };
      plus.onclick = () => { if (Object.values(cnt).reduce((a, c) => a + c, 0) < TOTAL) { cnt[x.k]++; upd(); } };
      rows.append(r);
    });
    $$('.tabs button', p).forEach(t => t.onclick = () => {
      if (!firstInfo) firstInfo = t.dataset.t;
      t.classList.toggle('on');
      $$('.inf .' + t.dataset.t, p).forEach(d => d.classList.toggle('on'));
    });
    $('.btn', p).onclick = () => {
      const diff = cnt.mu - cnt.chen;
      // 阿木多 → 情感；老陈多或平均 → 思考
      add('TF', diff === 0 ? .3 : -clamp(diff / 3, -1, 1), 1.2, `分水时，你给了生病的阿木 ${cnt.mu} 瓶、干活最多的老陈 ${cnt.chen} 瓶`);
      if (firstInfo) add('TF', firstInfo === 'c' ? 1 : -1, .35);
      clearStage(); res(cnt);
    };
  });
}

function planGame() {
  return new Promise(res => {
    const tasks = ['🏠 加固屋顶', '💧 收集淡水', '🪵 搬运柴火', '🎣 收回渔网', '🥫 把食物搬进山洞', '🚩 检查信号旗'];
    const order = []; const t0 = performance.now(); let left = 45, iv;
    const p = panel(`<div class="ptitle">⛈️ 风暴前的准备</div><div class="phint">风暴还有 <b class="cd">45</b> 秒到达。你可以先依次点击任务排好顺序，也可以直接开干。</div><div class="list"></div><div class="row"><button class="btn ghost go">别想了，直接开干！</button><button class="btn plan" disabled>按这个顺序执行</button></div>`);
    const list = $('.list', p), planBtn = $('.plan', p);
    const draw = () => {
      list.innerHTML = '';
      tasks.forEach(t => {
        const i = order.indexOf(t);
        const d = el('div', 'task' + (i >= 0 ? ' on' : ''), `<div class="no">${i >= 0 ? i + 1 : ''}</div>${t}`);
        d.onclick = () => { i >= 0 ? order.splice(i, 1) : order.push(t); draw(); };
        list.append(d);
      });
      planBtn.disabled = order.length !== tasks.length;
    };
    draw();
    iv = setInterval(() => { left--; $('.cd', p).textContent = left; if (left <= 0) start(order.length === tasks.length); }, 1000);
    $('.go', p).onclick = () => start(false);
    planBtn.onclick = () => start(true);
    let started = false;
    function start(planned) {
      if (started) return; started = true; clearInterval(iv);
      const pt = Math.round((performance.now() - t0) / 1000);
      if (planned) add('JP', 1, 1, `风暴来临前，你花了 ${pt} 秒把 6 项任务全部排好了顺序`);
      else if (order.length >= 3) add('JP', .2, 1);
      else add('JP', -1, 1, '风暴来临前，你没排计划，直接撸起袖子开干');
      execute(planned);
    }
    function execute(planned) {
      const done = []; let interrupted = false;
      const seq = planned ? order : tasks;
      p.innerHTML = `<div class="ptitle">🔨 开工！</div><div class="phint">点击任务完成它。</div><div class="list"></div>`;
      const l = $('.list', p);
      seq.forEach(t => {
        const d = el('div', 'task', `<div class="no"></div>${t}<div class="pg"></div>`);
        d.onclick = async () => {
          if (d.classList.contains('doing') || interrupted) return;
          d.classList.add('doing'); await wait(720);
          d.classList.add('done'); $('.no', d).textContent = '✓'; done.push(t);
          if (done.length === 3) {
            interrupted = true;
            await choose('哗啦——屋顶突然漏水了！你会——', [
              O('停一下，把剩下的任务重新排一遍', 'JP', 1, 1, '干到一半屋顶漏水，你停下来重新排了剩下的任务'),
              O('先冲过去补漏，剩下的到时候再说', 'JP', -1, 1, '干到一半屋顶漏水，你先冲过去补漏，其他的再说'),
            ]);
            interrupted = false;
          }
          if (done.length === tasks.length) {
            if (planned) { const same = done.slice(0, 3).every((t, i) => t === order[i]); add('JP', same ? 1 : -.6, .4); }
            await wait(300); clearStage(); res();
          }
        };
        l.append(d);
      });
    }
  });
}
function packGame() {
  return new Promise(res => {
    const items = [
      { e: '🥫', c: 'food' }, { e: '🍞', c: 'food' }, { e: '🍫', c: 'food' },
      { e: '🔦', c: 'tool' }, { e: '🪢', c: 'tool' }, { e: '🔪', c: 'tool' },
      { e: '🩹', c: 'med' }, { e: '💊', c: 'med' },
    ];
    const comps = [{ k: 'food', n: '🍱 食物袋' }, { k: 'tool', n: '🧰 工具袋' }, { k: 'med', n: '⛑️ 医药袋' }, { k: 'main', n: '🎒 大主仓' }];
    const placed = new Map(); let sel = null, dumped = false;
    const p = panel(`<div class="ptitle">🎒 收拾应急背包</div><div class="phint">风暴来了要撤到山洞。先点一样东西，再点放进哪个袋子。</div><div class="grid4"></div><div class="bag"></div><button class="btn ghost dump">全部塞进大主仓！</button>`);
    const grid = $('.grid4', p), bag = $('.bag', p);
    items.forEach(it => {
      const b = el('button', 'item', `<div class="e">${it.e}</div>`); it.b = b;
      b.onclick = () => { $$('.item', p).forEach(x => x.classList.remove('sel')); sel = it; b.classList.add('sel'); $$('.comp', p).forEach(c => c.classList.add('ready')); };
      grid.append(b);
    });
    comps.forEach(c => {
      const d = el('div', 'comp', `<div class="ct">${c.n}</div><div class="cc"></div>`); c.d = d;
      d.onclick = () => { if (!sel) return; put(sel, c); sel = null; $$('.comp', p).forEach(x => x.classList.remove('ready')); check(); };
      bag.append(d);
    });
    function put(it, c) { placed.set(it, c.k); it.b.classList.remove('sel'); it.b.classList.add('gone'); $('.cc', c.d).textContent += it.e; }
    $('.dump', p).onclick = () => { dumped = true; items.filter(i => !placed.has(i)).forEach(i => put(i, comps[3])); check(); };
    function check() {
      if (placed.size < items.length) return;
      const right = items.filter(i => placed.get(i) === i.c).length;
      if (dumped && right < 4) add('JP', -1, .9, '收拾背包时，你一键把所有东西塞进了大主仓');
      else add('JP', right / items.length * 2 - 1, .9, right >= 6 ? '收拾背包时，你把每样东西都分门别类放好了' : null);
      setTimeout(() => { clearStage(); res(); }, 500);
    }
  });
}

       ['梦里有人递给你一个麦克风——', '接过来，说两句', '笑着摆手，递给下一个人']],
  SN: [['梦里你收到一封没有署名的信，你先注意到——', '信纸的质地、字迹和邮戳', '字里行间似乎藏着的意思'],
       ['梦里有一扇紧闭的门——', '先看看门锁是什么结构', '想象门后会是怎样一个世界']],
  TF: [['梦里朋友做了一个你觉得不太好的决定——', '直接指出其中的问题', '先理解他为什么会这样选'],
       ['梦里你们要选一位队长——', '选能力最强的那个人', '选大家最信任的那个人']],
  JP: [['梦里你要去旅行——', '先做好一份详细攻略', '买张票就出发'],
       ['梦里你的书桌——', '每样东西都有固定的位置', '乱中有序，反正我知道东西在哪']],
};
async function dream() {
  const dims = Object.keys(DIMS).filter(d => Math.abs(pct(d) - 50) <= 5);
  if (!dims.length) return;
  setScene('night'); vignette('🌙');
  await talk(['风暴过后的那个夜晚，你睡得很沉。', '你做了一个很长、很长的梦……']);
  for (const d of dims) for (const [q, a, b] of TIEBREAK[d]) await choose(q, [O(a, d, 1, 1), O(b, d, -1, 1)]);
  await talk(['……醒来时，窗外的海已经平静了。']);
}

const PARTNER = { INTJ: 'ENFP', INTP: 'ENTJ', ENTJ: 'INTP', ENTP: 'INFJ', INFJ: 'ENTP', INFP: 'ENFJ', ENFJ: 'INFP', ENFP: 'INTJ', ISTJ: 'ESFP', ISFJ: 'ESTP', ESTJ: 'ISTP', ESFJ: 'ISFP', ISTP: 'ESTJ', ISFP: 'ESFJ', ESTP: 'ISFJ', ESFP: 'ISTJ' };
const TEMPER = {
  NT: { c: '#8b7bff', n: '紫色', w: '理性者之光' },
  NF: { c: '#3ecf8e', n: '绿色', w: '理想者之光' },
  SJ: { c: '#4a90ff', n: '蓝色', w: '守护者之光' },

};
const opposite = t => t.split('').map(ch => ({ E: 'I', I: 'E', S: 'N', N: 'S', T: 'F', F: 'T', J: 'P', P: 'J' })[ch]).join('');
const temperOf = t => t[1] === 'N' ? 'N' + t[2] : 'S' + t[3];

function computeResult() {
  if (G.journal > 0) add('JP', .6, .25);
  const L = {}, P = {}, bal = {};
  for (const d in DIMS) { const s = dimScore(d); L[d] = s >= 0 ? DIMS[d][0] : DIMS[d][1]; P[d] = pct(d); bal[d] = Math.abs(P[d] - 50) <= 5; }
  const type = L.EI + L.SN + L.TF + L.JP;
  // 压力模式：平时与风暴中倾向相反
  const shifts = [];
  for (const d in DIMS) {
    if (!G.stress[d].length) continue;
    const c = dimScore(d, G.calm), s = dimScore(d, G.stress);
    if (Math.sign(c) !== Math.sign(s) && Math.abs(c) >= .2 && Math.abs(s) >= .5) {
      const a = c > 0 ? DIMS[d][0] : DIMS[d][1], b = s > 0 ? DIMS[d][0] : DIMS[d][1];
      shifts.push(`平时你偏向 <b>${a}（${LETTER_NAME[a]}）</b>，但在风暴中会切换到 <b>${b}（${LETTER_NAME[b]}）</b>`);
    }
  }
  // 关键时刻：每个维度挑一条与结果方向一致、权重最高的
  const picks = [];
  for (const d in DIMS) {
    const sign = L[d] === DIMS[d][0] ? 1 : -1;
    const m = G.moments.filter(x => x.dim === d && Math.sign(x.v) === sign).sort((a, b) => b.w - a.w)[0];
    if (m) picks.push({ ...m, letter: L[d] });
  }
  picks.sort((a, b) => a.day - b.day);
  return { type, L, P, bal, shifts, picks };
}

function noteGame() {
  return new Promise(res => {
    const p = panel(`<div class="ptitle">✉️ 写给未来的自己</div><div class="phint">阿嬷说：「点灯之前，对着灯许个愿吧。写一句话，给未来的自己。」</div><textarea class="field" maxlength="40" placeholder="比如：别怕，往有光的地方走。"></textarea><div class="row"><button class="btn ghost skip">不写了</button><button class="btn ok">写好了</button></div>`);
    $('.skip', p).onclick = () => { G.note = ''; clearStage(); res(); };
    $('.ok', p).onclick = () => { G.note = $('textarea', p).value.trim(); clearStage(); res(); };
  });
}

/* ================== 结果页 ================== */
function showResult(R) {
  const role = ROLES[R.type], tp = TEMPER[temperOf(R.type)];
  const mate = PARTNER[R.type], foe = opposite(R.type);
  const bars = Object.keys(DIMS).map(d => {
    const [a, b] = DIMS[d], pa = R.P[d], pb = 100 - pa, win = R.L[d];
    return `<div class="bar"><div class="lb"><span class="${win === a ? '' : 'dim'}">${a} ${LETTER_NAME[a]} ${pa}%</span><span class="${win === b ? '' : 'dim'}">${pb}% ${LETTER_NAME[b]} ${b}</span></div><div class="tr"><i data-w="${pa}"></i></div>${R.bal[d] ? `<div class="bal">⚖️ 平衡型：两种倾向你都能自如切换</div>` : ''}</div>`;
  }).join('');
  const moms = R.picks.map(m => `<li><span class="d">DAY ${m.day}</span><span>${m.text}</span><span class="k">${m.letter}</span></li>`).join('');
  const r = el('div', '', `
    <div class="rhead"><span class="tag">${tp.w.toUpperCase()}</span><div class="emo">${role.e}</div><div class="type">${R.type}</div><div class="role">${role.n}</div><div class="tl">「${role.t}」</div></div>
    <div class="rbody">
      <div class="card"><h3>🧭 你的四维倾向</h3>${bars}</div>
      <div class="card"><h3>🏝️ 岛上的你</h3><p>${role.d}</p></div>
      ${moms ? `<div class="card"><h3>🎞️ 你的关键时刻</h3><ul class="mom">${moms}</ul></div>` : ''}
      ${R.shifts.length ? `<div class="card"><h3>🌪️ 压力模式</h3><p>${R.shifts.join('；<br>')}。<br>压力会让人切换到不常用的一面，这很正常，也是你的另一种力量。</p></div>` : ''}
      <div class="card"><h3>✨ 你的优势</h3><div class="pills">${role.s.map(x => `<span>${x}</span>`).join('')}</div><h3 style="margin-top:16px">🌫️ 你的盲点</h3><p>${role.b}</p></div>
      <div class="card"><h3>🤝 岛上搭档</h3><div class="mates">
        <div class="mate"><div class="e">${ROLES[mate].e}</div><div class="t">${mate}</div><div class="n">${ROLES[mate].n}</div><div class="h">💞 最合拍</div></div>
        <div class="mate"><div class="e">${ROLES[foe].e}</div><div class="t">${foe}</div><div class="n">${ROLES[foe].n}</div><div class="h">⚡ 最需要磨合</div></div>
      </div></div>
      ${G.note ? `<div class="card"><h3>✉️ 留给未来的话</h3><div class="quote">${G.note.replace(/[<>&]/g, '')}</div></div>` : ''}
      <button class="btn poster">生成分享海报</button>
      <button class="btn ghost again">再漂流一次</button>
      <div class="disc">本测试基于 MBTI 理论框架，结合情境选择与行为数据进行估算，<br>仅供娱乐与自我探索，不作为心理诊断依据。</div>
    </div>`);
  r.id = 'result'; r.style.setProperty('--tc', tp.c);
  app.append(r);
  setTimeout(() => $$('.tr i', r).forEach(i => i.style.width = i.dataset.w + '%'), 200);
  $('.again', r).onclick = () => location.reload();
  $('.poster', r).onclick = () => {
    const url = makePoster(R, role, tp);
    const m = el('div', 'overlay modal', `<div class="panel pop" id="posterBox"><img src="${url}" alt="分享海报"><div class="phint" style="text-align:center;margin:10px 0 0">手机长按图片保存，电脑可点击下载</div><div class="row"><a class="btn" style="text-align:center;text-decoration:none" download="灯塔岛-${R.type}.png" href="${url}">下载海报</a><button class="btn ghost">关闭</button></div></div>`);
    $('button', m).onclick = () => m.remove();
    m.style.zIndex = 40; app.append(m);

}
function makePoster(R, role, tp) {
  const W = 750, H = 1240, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const font = (s, w = 400) => `${w} ${s}px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif`;
  const rr = (X, Y, w, h, r) => { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); };
  const wrap = (t, X, Y, maxW, lh) => { let line = '', y = Y; for (const ch of t) { if (x.measureText(line + ch).width > maxW) { x.fillText(line, X, y); line = ch; y += lh; } else line += ch; } x.fillText(line, X, y); return y; };
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, tp.c); g.addColorStop(1, '#1b2148');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.textAlign = 'center'; x.fillStyle = '#fff';
  x.font = font(32, 800); x.fillText('灯塔岛 · 七日漂流', W / 2, 92);
  x.font = font(22); x.globalAlpha = .75; x.fillText(`${G.name} 的漂流报告 · ${tp.w}`, W / 2, 132); x.globalAlpha = 1;
  x.fillStyle = '#fffaf0'; rr(50, 170, W - 100, 930, 40); x.fill();
  x.font = font(150); x.fillText(role.e, W / 2, 360);
  x.fillStyle = tp.c; x.font = font(112, 900); x.fillText(R.type, W / 2, 500);
  x.fillStyle = '#2b2a33'; x.font = font(46, 800); x.fillText(role.n, W / 2, 570);
  x.fillStyle = '#8a8597'; x.font = font(26); wrap(`「${role.t}」`, W / 2, 620, 560, 38);
  Object.keys(DIMS).forEach((d, i) => {
    const y = 700 + i * 72, [a, b] = DIMS[d], p = R.P[d];
    x.font = font(24, 700); x.fillStyle = '#2b2a33';
    x.textAlign = 'left'; x.fillText(`${a} ${p}%`, 110, y);
    x.textAlign = 'right'; x.fillText(`${100 - p}% ${b}`, W - 110, y);
    x.fillStyle = '#eee8dc'; rr(110, y + 14, W - 220, 14, 7); x.fill();
    x.fillStyle = tp.c; rr(110, y + 14, Math.max(14, (W - 220) * p / 100), 14, 7); x.fill();
  });
  x.textAlign = 'center'; x.fillStyle = '#4a4656'; x.font = font(26, 400);
  wrap(G.note ? `✉️ ${G.note}` : `「${role.s.join(' · ')}」`, W / 2, 1010, 560, 40);
  x.fillStyle = '#fff'; x.font = font(26, 700); x.fillText('一场荒岛冒险，测出你的 MBTI', W / 2, 1160);
  x.globalAlpha = .6; x.font = font(20); x.fillText('不做一道题，七天看清你自己', W / 2, 1198);
  return c.toDataURL('image/png');
}
