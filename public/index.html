<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2148">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>灯塔岛 · 七日漂流</title>
<meta name="description" content="一场荒岛冒险，测出你的 MBTI。不做一道题，七天看清你自己。">
<meta property="og:title" content="灯塔岛 · 七日漂流">
<meta property="og:description" content="一场荒岛冒险，测出你的 MBTI">
<meta property="og:image" content="https://res.cloudinary.com/eumlccug/image/upload/share_thumb.jpg">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body>
<div id="app">
  <div id="scene"></div>
  <div class="lbar top"></div><div class="lbar bottom"></div>

  <div id="hud">
    <div class="hl"><div id="hudDay"></div><div id="hudParts"></div><div id="stamina" hidden></div></div>
    <div class="hr">
      <button id="btnJournal" title="日志">📔</button>
      <button id="btnBag" title="背包">🎒</button>
      <button id="btnSettings" title="设置">⚙️</button>
    </div>
  </div>
  <div id="tracker"></div>
  <div id="edgeArrow" hidden>➤</div>
  <button id="interactBtn"></button>

  <div id="caption"></div>
  <div id="dialog"></div>
  <div id="choice"></div>
  <div id="toasts"></div>
  <div id="fade" class="on"></div>

  <div id="loading"><div class="lh">🗼</div><div>正在漂向灯塔岛……</div></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
